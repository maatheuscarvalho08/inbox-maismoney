# Config do Nginx para o preview. Copie para /etc/nginx/sites-available/maismoney-preview,
# ajuste SEU_DOMINIO_PREVIEW, crie o link simbólico em sites-enabled e rode certbot
# (veja DEPLOY.md). Não altera o site de produção.

server {
    listen 80;
    listen [::]:80;
    server_name SEU_DOMINIO_PREVIEW;

    client_max_body_size 30M;

    # Preview não deve aparecer em buscadores.
    add_header X-Robots-Tag "noindex, nofollow" always;

    root /var/www/maismoney-preview/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /socket.io/ {
        proxy_pass http://127.0.0.1:3334;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3334;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
