# Config do Nginx para a VPS. Copie para /etc/nginx/sites-available/maismoney-inbox,
# ajuste SEU_DOMINIO abaixo, crie o link simbólico em sites-enabled e rode certbot
# (veja DEPLOY.md — o certbot reescreve este arquivo para adicionar HTTPS sozinho).

server {
    listen 80;
    listen [::]:80;
    server_name SEU_DOMINIO;

    # Uploads de mídia (fotos/áudios) podem passar de 1MB, que é o padrão do Nginx.
    client_max_body_size 30M;

    # Frontend: build estático do Vite (rode `npm run build` em frontend/ e ajuste o caminho).
    root /var/www/maismoney-inbox/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # WebSocket (Socket.io) — precisa do upgrade de conexão explícito.
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3333;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API do backend.
    location /api/ {
        proxy_pass http://127.0.0.1:3333;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
